name: ContinousDeploymnet (Prod)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Set up docker buildX
        uses: docker/setup-buildx-action@v2

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ayushsingla7/k8s-learn:${{ github.sha }}

      - name: Clone ops repo, update image tags and push tags
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git clone https://github.com/Ayushsingla1/ops.git
          sed -i 's|image: ayushsingla7/k8s-learn:.*|image: ayushsingla7/k8s-learn:${{ github.sha }}' manifest.yml

          github config user.username "Github Actions Bot"
          github config user.email "actions@github.com"
          git add .
          git commit -m "update image to ${{ github.sha }}"
          git push https://${PAT}@github.com/ayushsingla1/ops.git main
